notes: >
  Entry battery option of the Mazda 6e (Changan EPA1 platform, built in China):
  a 68.8 kWh LFP pack driving a single rear motor with 190 kW / 320 Nm, which is
  more powerful and quicker than the 80 kWh Long Range (180 kW, 7.8 s), and
  charges faster on DC (165 kW peak, 10-80 % in about 24 min vs. roughly 90 kW
  and 47 min for the Long Range). Mazda Germany expects about 90 % of 6e sales
  to be this battery. German trims are Takumi and Takumi Plus.

  Gaps / caveats: usable battery capacity (66.0 kWh) is only from a secondary
  database (another lists 68.0 kWh) and is required by the schema, so treat it
  as an estimate. Curb and gross weight, towing capacity and real-world range
  are left unset because secondary sources disagree (e.g. curb weight 1,952 vs
  2,037 kg). Peak DC power is 165 kW in Mazda-derived sources; some
  third-party sites list 170 or 200 kW. The 24 min 10-80 % figure is from press
  coverage of the launch (22-27 min reported). Ground clearance is not set.
